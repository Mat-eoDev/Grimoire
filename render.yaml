# Configuration de deploiement Render (Blueprint).
# App unique : le serveur Express sert l'API + le build React (meme origine).
services:
  - type: web
    name: grimoire
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # A renseigner dans le dashboard Render : la chaine de connexion PostgreSQL de Neon
      # (elle doit contenir ?sslmode=require).
      - key: DATABASE_URL
        sync: false
      - key: SESSION_COOKIE_NAME
        value: newmj_session
      # Origine autorisee du front. En production le front est servi par ce meme
      # service (aucune requete cross-origin), mais la variable doit etre definie :
      # sans elle, env.clientOrigin retombait sur http://localhost:5173.
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: grimoire
          envVarKey: RENDER_EXTERNAL_URL
      # Email de bienvenue (optionnel) — a renseigner dans le dashboard Render.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Grimoire
      - key: APP_URL
        sync: false
