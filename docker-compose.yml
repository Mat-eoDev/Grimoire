services:
  postgres:
    image: postgres:16-alpine
    container_name: newmj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: newmj
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d newmj"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: node:22-alpine
    container_name: newmj-server
    restart: unless-stopped
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/newmj?schema=public
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:5173
      SESSION_COOKIE_NAME: newmj_session
    ports:
      - "4000:4000"
    volumes:
      - .:/workspace
      - server-root-node_modules:/workspace/node_modules
      - server-node_modules:/workspace/apps/server/node_modules
    command: >
      sh -lc "
      npm install --workspace @newmj/server &&
      npm --workspace @newmj/server run prisma:generate &&
      npm --workspace @newmj/server exec prisma db push &&
      npm --workspace @newmj/server run prisma:seed &&
      npm --workspace @newmj/server run dev
      "

  web:
    image: node:22-alpine
    container_name: newmj-web
    restart: unless-stopped
    working_dir: /workspace
    depends_on:
      server:
        condition: service_started
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - web-root-node_modules:/workspace/node_modules
      - web-node_modules:/workspace/apps/web/node_modules
    command: >
      sh -lc "
      npm install --workspace @newmj/web &&
      npm --workspace @newmj/web run dev -- --host 0.0.0.0
      "

volumes:
  postgres-data:
  server-root-node_modules:
  web-root-node_modules:
  server-node_modules:
  web-node_modules:
