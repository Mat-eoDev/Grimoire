# Empeche la mise en veille de l'app sur le plan gratuit Render.
# Le plan free endort le service apres ~15 min d'inactivite : le premier
# acces suivant subit alors un cold start de plusieurs dizaines de secondes.
# Ce cron reveille le serveur en pingant l'endpoint /health.
#
# Remarque : les crons GitHub Actions peuvent etre retardes (voire sautes)
# en periode de forte charge. L'intervalle de 5 min garde une marge sous les
# 15 min. Pour un reveil garanti a l'heure, utiliser un service dedie type
# cron-job.org pointant sur la meme URL /health.
#
# DESACTIVE : le declenchement planifie (toutes les 5 min) a ete retire car
# chaque echec envoyait une notification GitHub. Le workflow reste lancable
# a la main (Actions > keep-alive > Run workflow). Pour le reactiver, remettre :
#   schedule:
#     - cron: "*/5 * * * *"
name: keep-alive

on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          # Surchargeable via une variable de repo (Settings > Variables) ;
          # sinon on retombe sur l'URL de production par defaut.
          APP_URL: ${{ vars.APP_URL || 'https://grimoire-q9hj.onrender.com' }}
        run: |
          echo "Ping ${APP_URL}/health"
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 --retry 3 --retry-delay 10 "${APP_URL}/health")
          echo "HTTP ${code}"
          test "${code}" = "200"
